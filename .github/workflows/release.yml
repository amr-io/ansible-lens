name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: ${TAG_VERSION}, client package.json: ${CLIENT_VERSION}, root package.json: ${ROOT_VERSION}"
          if [ "${TAG_VERSION}" != "${CLIENT_VERSION}" ] || [ "${TAG_VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error::Version mismatch: git tag v${TAG_VERSION} does not match package.json (${ROOT_VERSION}) or packages/client/package.json (${CLIENT_VERSION})."
            exit 1
          fi

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Build workspaces
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run full test suite
        run: npm test

      - name: Package VS Code extension (.vsix)
        run: npm run package:vsix

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Generate SHA256SUMS.txt
        run: sha256sum packages/client/*.vsix sbom.cdx.json > SHA256SUMS.txt

      - name: Attest SLSA Build Provenance for VSIX
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/client/*.vsix

      - name: Create GitHub Release with VSIX, SBOM, and SHA256SUMS.txt
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            packages/client/*.vsix
            sbom.cdx.json
            SHA256SUMS.txt
