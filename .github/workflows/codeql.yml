name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: '/language:${{ matrix.language }}'
          output: ../results

      - name: Verify zero CodeQL alerts in SARIF
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const files = fs.readdirSync("../results").filter((f) => f.endsWith(".sarif"));
            let total = 0;
            for (const file of files) {
              const sarif = JSON.parse(fs.readFileSync(path.join("../results", file), "utf8"));
              const results = (sarif.runs || []).flatMap((r) => r.results || []);
              total += results.length;
              for (const res of results) {
                const loc = res.locations?.[0]?.physicalLocation;
                console.log(`- [${res.ruleId}] ${loc?.artifactLocation?.uri}:${loc?.region?.startLine} ${res.message?.text}`);
              }
            }
            console.log(`CodeQL SARIF findings count: ${total}`);
            if (total > 0) {
              process.exit(1);
            }
          '
